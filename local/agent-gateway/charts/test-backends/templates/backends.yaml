{{- $root := . -}}
{{- range $backend := .Values.backends }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $backend.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/instance: {{ $backend.instance }}
spec:
  replicas: {{ $backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-backend
      app.kubernetes.io/instance: {{ $backend.instance }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-backend
        app.kubernetes.io/instance: {{ $backend.instance }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: mcp
          image: "{{ $root.Values.testMcpBackend.image.repository }}:{{ $root.Values.testMcpBackend.image.tag }}"
          imagePullPolicy: {{ $root.Values.testMcpBackend.image.pullPolicy }}
          env:
            - name: BACKEND_ID
              value: {{ printf "%s/%s" $root.Release.Namespace $backend.name | quote }}
          ports:
            - name: mcp
              containerPort: 3001
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $backend.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/instance: {{ $backend.instance }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/instance: {{ $backend.instance }}
  ports:
    - name: mcp
      port: 3001
      targetPort: mcp
      appProtocol: agentgateway.dev/mcp
{{- end }}
