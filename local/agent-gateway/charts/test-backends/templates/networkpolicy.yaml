{{- if .Values.networkPolicy.enabled }}
{{- $gatewayNamespace := required "networkPolicy.gatewayNamespace is required when networkPolicy.enabled=true" .Values.networkPolicy.gatewayNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dsx-agent-gateway-test-backends
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gatewayNamespace | quote }}
      ports:
        - protocol: TCP
          port: 3001
{{- end }}
