apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsx-identity
resources:
  - namespace.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: human-oidc-config
    files:
      - config.json=generated/human-oidc/config.json
  - name: human-oidc-signing-key
    files:
      - tls.key=generated/human-oidc/tls.key
  - name: service-oidc-config
    files:
      - config.json=generated/service-oidc/config.json
  - name: service-oidc-signing-key
    files:
      - tls.key=generated/service-oidc/tls.key
  - name: svid-issuer-config
    files:
      - config.json=generated/svid-issuer/config.json
  - name: svid-issuer-signing-key
    files:
      - tls.key=generated/svid-issuer/tls.key
  - name: svid-wrong-key-config
    files:
      - config.json=generated/svid-wrong-key/config.json
  - name: svid-wrong-key-signing-key
    files:
      - tls.key=generated/svid-wrong-key/tls.key
  - name: unconfigured-issuer-config
    files:
      - config.json=generated/unconfigured-issuer/config.json
  - name: unconfigured-issuer-signing-key
    files:
      - tls.key=generated/unconfigured-issuer/tls.key
