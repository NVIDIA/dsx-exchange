admissionWebhooks:
  certManager:
    enabled: false
  autoGenerateCert:
    enabled: true
    # Retain the serving certificate and CA together across Helm upgrades.
    recreate: false

minReadySeconds: 5

manager:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
