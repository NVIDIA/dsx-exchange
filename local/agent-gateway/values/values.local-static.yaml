# Separate values layer proving upstream maps merge without replacing selectors.
upstreams:
  mcp-backend-b-static:
    mode: static
    address: http://mcp-backend-b.csc-mcp-backends.svc:3001/mcp
    requestTimeout: 10s
  legacy-sse:
    mode: static
    address: http://mcp-backend-a.csc-mcp-backends.svc:3001/legacy-sse
    protocol: SSE
