# CPC-1 leaf local profile.
observability:
  metrics:
    enabled: false

valkey:
  metrics:
    enabled: false

agentgateway:
  discoveryNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: cpc-1-dsx-agentgateway
    - matchLabels:
        kubernetes.io/metadata.name: cpc-1-mcp-backends

bridge:
  role: leaf
  shardId: cpc-1

upstreams:
  backend-a:
    namespace: cpc-1-mcp-backends
    serviceLabels:
      app.kubernetes.io/name: mcp-backend
      app.kubernetes.io/instance: backend-a
  backend-b:
    namespace: cpc-1-mcp-backends
    serviceLabels:
      app.kubernetes.io/name: mcp-backend
      app.kubernetes.io/instance: backend-b
