{{- $root := . }}
{{- range $idx, $issuer := .Values.issuers }}
{{- $name := required (printf "issuers[%d].name is required" $idx) $issuer.name }}
{{- $config := required (printf "generated config for issuer %q is required" $name) ($root.Files.Get (printf "generated/%s/config.json" $name)) }}
{{- $signingKey := required (printf "generated signing key for issuer %q is required" $name) ($root.Files.Get (printf "generated/%s/tls.key" $name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
type: Opaque
data:
  config.json: {{ $config | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-signing-key
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
type: Opaque
data:
  tls.key: {{ $signingKey | b64enc | quote }}
{{- if lt (add1 $idx) (len $root.Values.issuers) }}
---
{{- end }}
{{- end }}
