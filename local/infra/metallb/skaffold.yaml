apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: metallb
deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 600
  helm:
    releases:
    - name: metallb
      chartPath: ../../../.cache/helm/metallb-0.16.1.tgz
      namespace: metallb-system
      createNamespace: true
      skipBuildDependencies: true
      setValues:
        # The local topology uses L2 advertisements only. MetalLB 0.16 enables
        # the separate frr-k8s BGP backend by default unless explicitly disabled.
        frrk8s.enabled: false
---
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: metallb-config
requires:
- configs:
  - metallb
manifests:
  rawYaml:
  - ../sites/csc/address-pools.yaml
  - ../sites/cpc-1/address-pools.yaml
  - ../sites/cpc-2/address-pools.yaml
deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 180
  kubectl: {}
