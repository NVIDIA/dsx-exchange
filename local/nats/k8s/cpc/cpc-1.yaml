# CPC-1 specific overrides

global:
  eventBus:
    clusterId: "1"
    # CPC-1 specific mTLS permissions
    auth:
      permissions:
        mtls:
          mqtt-client:
            identity: "CN=mqtt-client.cpc-1"
            account: "CPC"
            # MQTT persistence uses the server's internal account client.
            permissions:
              pub:
                allow: ["test.>"]
              sub:
                allow: ["test.>"]
