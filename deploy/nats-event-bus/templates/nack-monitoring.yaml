{{- $metrics := .Values.nack.metrics | default dict }}
{{- if ($metrics.enabled | default false) }}
apiVersion: v1
kind: Service
metadata:
  name: nack-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nack
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: metrics
spec:
  ports:
    - name: metrics
      port: {{ required "nack.metrics.port is required" $metrics.port }}
      protocol: TCP
      targetPort: {{ $metrics.port }}
  selector:
    {{- if .Values.nack.useLegacyNames }}
    app: nack
    {{- else }}
    app.kubernetes.io/name: nack
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nack
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: metrics
    {{- with $metrics.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ required "nack.metrics.interval is required" $metrics.interval }}
      scrapeTimeout: {{ required "nack.metrics.scrapeTimeout is required" $metrics.scrapeTimeout }}
{{- end }}
