apiVersion: v2
name: nats-event-bus
description: NATS Event Bus with mTLS support
type: application
version: 0.2.0
appVersion: "0.2.0"

dependencies:
  - name: nats
    version: "2.14.2"
    repository: https://nats-io.github.io/k8s/helm/charts/
    alias: nats
  - name: nats
    version: "2.14.2"
    repository: https://nats-io.github.io/k8s/helm/charts/
    alias: nats-mtls
    condition: global.eventBus.mtls.enabled
  - name: nack
    version: "0.34.0"
    repository: https://nats-io.github.io/k8s/helm/charts/
  - name: auth-callout
    version: "0.1.1"
    repository: file://../../auth-callout/deploy
    alias: auth-callout
  - name: surveyor
    version: "0.20.9"
    repository: https://nats-io.github.io/k8s/helm/charts/
