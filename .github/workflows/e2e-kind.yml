# expressions reference repository metadata or env vars only.

name: E2E Kind

on:
  workflow_call:

permissions:
  contents: read

env:
  DOCKERHUB_MIRROR: "https://dc.local.gha-runners.nvidia.com"
  MISE_LOCKED: "1"

jobs:
  e2e-kind:
    name: Run Kind E2E
    runs-on: linux-amd64-cpu32
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-mise
        with:
          cache-key: e2e

      - name: Cache local dependencies
        uses: actions/cache@v4
        with:
          path: .cache
          key: local-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('local/scripts/prepare-dependencies.sh', 'local/scripts/cache-*.sh') }}

      - name: Configure Docker Hub mirror
        run: bash .github/workflows/e2e-kind/configure-dockerhub-mirror.sh

      - name: Show e2e runner resources
        run: bash .github/workflows/e2e-kind/show-runner-resources.sh

      - name: Prepare e2e runner
        run: bash .github/workflows/e2e-kind/prepare-runner.sh

      - name: Deploy local stack
        run: make local-up

      - name: Test Event Bus functional behavior
        run: make test-event-bus-functional

      - name: Test Event Bus performance
        run: make test-event-bus-performance

      - name: Test Agent Gateway
        env:
          RUN_DESTRUCTIVE_FUNCTIONAL: "1"
        run: make test-agent-gateway

      - name: Collect e2e diagnostics
        if: failure()
        run: |
          set +e
          command -v kubectl >/dev/null 2>&1 || exit 0

          context=kind-dsx-exchange
          kubectl get nodes --context "${context}" -o wide
          kubectl get pods -A --context "${context}" -o wide
          kubectl get gateways -A --context "${context}" -o wide
          kubectl get events -A --context "${context}" --sort-by=.lastTimestamp | tail -200

          bash .github/workflows/e2e-kind/show-runner-resources.sh

      - name: Cleanup Kind cluster
        if: always()
        run: make clean
